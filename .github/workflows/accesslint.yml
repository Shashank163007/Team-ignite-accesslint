name: AccessLint CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  accessibility-audit:
    runs-on: ubuntu-latest
    name: Run AccessLint Accessibility Audit

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Action Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Serve Accessibility Fixtures
        run: |
          npx --yes serve -l 3000 tests > /tmp/accesslint-serve.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/fixtures/bad-contrast.html > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/fixtures/bad-contrast.html > /dev/null

      - name: Checkout Base Branch for Baseline Scan
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/base-repo
          git worktree add /tmp/base-repo ${{ github.base_ref }}
          echo "Base branch ${{ github.base_ref }} checked out to /tmp/base-repo"

      - name: Run Baseline Scan on Base Branch
        if: github.event_name == 'pull_request'
        id: base-scan
        run: |
          # The base checkout is used only as a comparison placeholder here.
          # Always provide valid JSON; the action itself owns target inputs.
          printf '[]\n' > /tmp/base-scan.json

      - name: Run AccessLint on PR Branch
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-scan-path: '/tmp/base-scan.json'
          target-url: 'http://localhost:3000'
          fail-on-new: 'false'
          routes: '/fixtures/bad-contrast.html'
