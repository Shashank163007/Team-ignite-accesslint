<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AccessLint Contrast Fixture</title>
    <style>
      :root {
        background: #ffffff;
        color: #1f2937;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0 auto;
        max-width: 60rem;
        padding: 1rem;
      }

      .contrast-failure {
        background: #ffffff;
        color: #aaaaaa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Color contrast test page</h1>
      <p>
        This page contains one intentional color contrast failure for the
        accessibility scanner.
      </p>
      <p class="contrast-failure" id="low-contrast-text">
        This text has insufficient contrast against its white background.
      </p>
    </main>
  </body>
</html>
